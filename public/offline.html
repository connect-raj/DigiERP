<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DigiERP — Offline</title>
  <style>
    body {
      background: #141313;
      color: #e5e2e1;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hanken Grotesk', sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      max-width: 600px;
      text-align: center;
    }
    .icon {
      font-size: 64px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 32px;
      font-weight: 600;
      margin: 0 0 12px 0;
    }
    p {
      font-size: 16px;
      color: #c4c7c8;
      margin: 0 0 24px 0;
      line-height: 1.5;
    }
    .info {
      background: #1f1f1f;
      border: 0.5px solid #333;
      border-radius: 8px;
      padding: 16px;
      margin-top: 24px;
      font-size: 14px;
      color: #c4c7c8;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>You're Offline</h1>
    <p>DigiERP requires an internet connection to sync data with the server.</p>
    <div class="info">
      <p>Please check your connection and try again, or wait until you're back online.</p>
    </div>
  </div>
</body>
</html>
